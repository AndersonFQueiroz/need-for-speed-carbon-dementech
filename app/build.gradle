plugins { id 'com.android.application' }

// Dementech · NFS Carbon — modulo do launcher.
//
// O motor (recompilacao estatica do Carbon de Xbox 360) NAO e compilado aqui:
// ele vem pronto do release oficial do port (veja tools/fetch_engine.sh) e vive
// em app/src/main/jniLibs/arm64-v8a, que nao e versionado neste repositorio.
//
// O package id permanece com.nfscarbon.android no 0.1.x de proposito: o save do
// jogo vive em /data/user/0/<package>/ e trocar o id exigiria migracao (v0.2).
// Os nomes de classe tambem permanecem porque os simbolos JNI do motor (.so) sao
// Java_com_nfscarbon_android_GameActivity_* / _TouchControlsView_*.

android {
    namespace 'com.nfscarbon.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nfscarbon.android'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.1.0-alpha.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            // A assinatura e feita fora do Gradle (tools/build.sh), com a chave
            // local do mantenedor, que nunca entra no repositorio.
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // As libs nativas precisam ser extraidas (nao comprimidas) no APK.
    packaging { jniLibs { useLegacyPackaging true } }

    lint { abortOnError false }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.android.material:material:1.12.0'
}
