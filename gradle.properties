# Ajustado para build no proprio celular (Termux, aarch64, ~5 GB RAM com ~1.5 GB livres).
org.gradle.jvmargs=-Xmx900m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false
android.useAndroidX=true
android.nonTransitiveRClass=true
# aapt2 nativo (arm64): o binario oficial do build-tools e x86_64 e nao roda no
# celular; o do Termux (2.20 / Android 16) le a plataforma android-35 corretamente.
android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
